import com.replaymod.gradle.preprocess.Node

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'com.replaymod.preprocess' version 'v1.0.1'
}
// Minecraft switched from three-segment (1.21.11) to two-segment (26.1) versions with the 26.x
// line. Padding a missing patch to 00 keeps both shapes comparable as one integer, so 1.21.11
// stays 12111 and 26.1 becomes 260100. common.gradle reads this off rootProject rather than
// carrying a second copy.
ext.mcVersionOf = { final String version ->
    final List<String> parts = version.tokenize('.')
    (parts[0] + parts[1].padLeft(2, '0') + (parts.size() > 2 ? parts[2] : '0').padLeft(2, '0')).toInteger()
}
// The settings JITPACK branch leaves every version project out of the graph, so the
// preprocessor has no nodes to link in that mode either.
if (System.getenv('JITPACK')) {
    return
}
preprocess {
    strictExtraMappings = false
    final ArrayList<Node> versions = []
    file('versions').eachDir { final File dir ->
        final int mcVersion = mcVersionOf(dir.name)
        // An unobfuscated version has no intermediary namespace to resolve names through, so its
        // node carries a null mappings namespace: the link into it applies only the explicit
        // rename file, and everything else has to come from //#if branches.
        versions << createNode(dir.name, mcVersion, mcVersion >= 260100 ? null : '')
    }
    versions.sort { it.mcVersion }
    for (int i = 0; i < versions.size() - 1; ++i) {
        versions[i].link versions[i + 1], file("versions/mapping-${versions[i].project}-${versions[i + 1].project}.txt")
    }
}

// Native prediction library (native/README.md has the full maintainer writeup). Neither task
// runs as part of the normal build/check lifecycle: contributors without a C toolchain build
// against the binaries already committed under native/prebuilt/, which common.gradle copies
// into every version subproject's jar via processResources.
final List<String> nativeSources = [
    'native/shim/confluxnative.c',
    'native/shim/anvilscan.c',
    'native/cubiomes/biomenoise.c',
    'native/cubiomes/biomes.c',
    'native/cubiomes/generator.c',
    'native/cubiomes/layers.c',
    'native/cubiomes/noise.c',
    'native/cubiomes/terrainnoise.c',
    'native/cubiomes/finders.c',
    // The upstream header split moved the end-city/fortress/camp piece
    // generators out of finders.c into features/. finders.c calls them
    // directly, so they are hard link dependencies, unlike stronghold.c
    // below (error-path only).
    'native/cubiomes/features/end_city.c',
    'native/cubiomes/features/fortress.c',
    'native/cubiomes/features/abandoned_camp.c',
    'native/cubiomes/terrain_features.c',
    // finders.c calls struct2str (util.c) on a loot-table error path and
    // getStrongholdLoot (features/stronghold.c) from getStructureLoot. The shim
    // never reaches either, but an ELF shared object resolves lazily, so leaving
    // them undefined turns a stray call into a process-level symbol failure
    // instead of a C-level error. -Wl,--no-undefined below keeps it that way.
    'native/cubiomes/util.c',
    'native/cubiomes/features/stronghold.c',
]
final List<String> nativeCflags = [
    '-shared', '-fPIC', '-O2', '-g0', '-fno-fast-math', '-ffp-contract=off', '-fvisibility=hidden', '-Wall',
    '-Wl,--no-undefined',
    '-Inative/jni', '-Inative/cubiomes',
]

// Provenance for the committed binaries is generated from the build outputs themselves: a
// hand-copied digest can drift from the bytes it claims to describe, a computed one cannot.
static String sha256Hex(final File f) {
    return java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
}

/** Replaces (or appends) the WASM row of native/prebuilt/BUILD_INFO.md in place. */
static void updateBuildInfoWasmRow(final File buildInfo, final File wasm, final String zigVersion) {
    final String row = "| `common/src/main/resources/webmap/predictor.wasm` | `wasm32-wasi` | " +
        '`zig cc -target wasm32-wasi -mexec-model=reactor -O3 -g0 -msimd128`' +
        " | `${sha256Hex(wasm)}` | ${String.format('%,d', wasm.length())} bytes |\n"
    final String header = "## Web Map WASM Asset Provenance\n\n" +
        "- **Cross-Compiler Toolchain**: `zig cc ${zigVersion}`\n\n" +
        "| Asset | Target Triple | Compiler Command | SHA-256 Checksum | Size |\n" +
        "|---|---|---|---|---|\n"
    final String existing = buildInfo.exists() ? buildInfo.text : ''
    final String rowPattern = /(?m)^\| `common\/src\/main\/resources\/webmap\/predictor\.wasm`.*$/
    if (existing =~ rowPattern) {
        buildInfo.text = existing.replaceAll(rowPattern,
            java.util.regex.Matcher.quoteReplacement(row.trim()))
        return
    }
    if (existing.contains('## Web Map WASM Asset Provenance')) {
        buildInfo.text = existing.trim() + '\n' + row
        return
    }
    buildInfo.parentFile.mkdirs()
    final String head = existing.replaceAll(/(?s)\n+$/, '')
    final String wasmSection = header + row
    buildInfo.text = head + (head.isEmpty() ? '' : '\n\n') + wasmSection
}

final List<String> webPredictorSources = [
    'native/web/confluxpredict.c',
    'native/cubiomes/biomenoise.c',
    'native/cubiomes/biomes.c',
    'native/cubiomes/generator.c',
    'native/cubiomes/layers.c',
    'native/cubiomes/noise.c',
]

tasks.register('buildWebPredictor', Exec) {
    group = 'build'
    description = 'Compiles the browser cubiomes predictor into the committed web-map WASM asset.'
    final File outFile = rootProject.file('common/src/main/resources/webmap/predictor.wasm')
    inputs.files(webPredictorSources.collect { final String src -> rootProject.file(src) })
    inputs.dir rootProject.file('native/cubiomes/tables')
    outputs.file outFile
    workingDir rootProject.projectDir
    commandLine([
        'zig', 'cc', '-target', 'wasm32-wasi', '-mexec-model=reactor', '-O3', '-g0', '-fno-fast-math',
        '-ffp-contract=off', '-fvisibility=hidden', '-ffunction-sections',
        '-fdata-sections', '-msimd128', '-Inative/cubiomes', '-Wl,--no-entry',
        '-Wl,--gc-sections', '-Wl,--export=cfxWebInit',
        '-Wl,--export=cfxWebGenerateTile', '-Wl,--export=cfxWebBiomeData',
        '-Wl,--export=cfxWebHeightData', '-Wl,--export=cfxWebSurfaceData',
        '-Wl,--export=cfxWebCanopyData',
        '-Wl,--export-memory', '-o', outFile.absolutePath,
    ] + webPredictorSources + ['-lm'])
    doLast {
        final String zigVersion = ['zig', 'version'].execute().text.trim()
        final File buildInfo = rootProject.file('native/prebuilt/BUILD_INFO.md')
        updateBuildInfoWasmRow(buildInfo, outFile, zigVersion)
        println "buildWebPredictor: predictor.wasm built (${outFile.length()} bytes, sha256: ${sha256Hex(outFile)})"
    }
}

tasks.register('buildNativesHost', Exec) {
    group = 'build'
    description = 'Compiles the cubiomes+shim native library for this host (linux-x86_64) into native/prebuilt/.'
    final File outFile = rootProject.file('native/prebuilt/linux-x86_64/libconfluxnative.so')
    inputs.files(nativeSources.collect { final String src -> rootProject.file(src) })
    inputs.dir rootProject.file('native/cubiomes/tables')
    inputs.dir rootProject.file('native/jni')
    outputs.file outFile
    doFirst {
        outFile.parentFile.mkdirs()
    }
    workingDir rootProject.projectDir
    commandLine(['cc'] + nativeCflags + ['-o', outFile.absolutePath] + nativeSources + ['-lm'])
}

// Pre-1.18 overview harnesses (native/test_legacy_matrix.c, native/test_web_legacy.c).
// These pin the accelerated legacy paths against master's per-pixel formula, cubiomes' exact
// columns (COLSTRAT2) and the web predictor's bit-for-bit parity. Kept off the `check`
// lifecycle like the build tasks above, because they need a host C toolchain; CI runs them
// explicitly. -PfullLegacyMatrix widens COLSTRAT2 to every seed/origin/stride combination.
tasks.register('testNativeLegacy') {
    group = 'verification'
    description = 'Builds and runs the pre-1.18 legacy overview harnesses with the host C compiler.'
    final List<String> cubiomesSources = nativeSources.findAll {
        !it.contains('confluxnative.c') && !it.contains('anvilscan.c')
    }
    final List<String> harnessCflags = [
        '-O2', '-g0', '-fno-fast-math', '-ffp-contract=off', '-Wall',
        '-Inative/jni', '-Inative/cubiomes',
    ]
    final File matrixBin = rootProject.file('build/bin/test_legacy_matrix')
    final File webBin = rootProject.file('build/bin/test_web_legacy')
    final boolean fullMatrix = project.hasProperty('fullLegacyMatrix')
    doLast {
        if (['which', 'cc'].execute().waitFor() != 0) {
            throw new GradleException('testNativeLegacy needs a host C compiler (`cc`) on PATH.')
        }
        matrixBin.parentFile.mkdirs()
        final List<List<String>> builds = [
            ['cc'] + harnessCflags + ['-o', matrixBin.absolutePath, 'native/test_legacy_matrix.c'] + cubiomesSources + ['-lm'],
            ['cc'] + harnessCflags + ['-o', webBin.absolutePath, 'native/test_web_legacy.c'] + cubiomesSources + ['-lm'],
        ]
        builds.each { final List<String> command ->
            final Process process = command.execute(null, rootProject.projectDir)
            final StringWriter output = new StringWriter()
            process.waitForProcessOutput(output, output)
            if (process.exitValue() != 0) {
                throw new GradleException("Native harness build failed:\n${command.join(' ')}\n${output}")
            }
        }
        final List<List<String>> runs = [
            fullMatrix ? [matrixBin.absolutePath, '--full'] : [matrixBin.absolutePath],
            [webBin.absolutePath],
        ]
        runs.each { final List<String> command ->
            final Process process = command.execute(null, rootProject.projectDir)
            final StringWriter output = new StringWriter()
            process.waitForProcessOutput(output, output)
            logger.lifecycle(output.toString().readLines().findAll {
                it.contains('mismatch') || it.contains('failures') || it.contains('drift') ||
                    it.startsWith('macro ') || it.startsWith('trunc ')
            }.join('\n'))
            if (process.exitValue() != 0) {
                throw new GradleException("Native harness failed (exit ${process.exitValue()}):\n${output}")
            }
        }
    }
}

tasks.register('buildNativesAll') {
    group = 'build'
    description = 'Cross-compiles the native library for every supported target with zig cc (maintainer-only; see native/README.md).'
    doLast {
        final Process which = ['which', 'zig'].execute()
        which.waitFor()
        if (which.exitValue() != 0) {
            throw new GradleException(
                'buildNativesAll requires the `zig` toolchain (zig cc) on PATH, which is not installed on this machine. ' +
                'Install zig (https://ziglang.org/download/) and re-run, or build a single target with buildNativesHost. ' +
                'See native/README.md for the target list.'
            )
        }
        final List<Map<String, String>> targets = [
            [zigTarget: 'x86_64-linux-gnu.2.17', dir: 'linux-x86_64', lib: 'libconfluxnative.so'],
            [zigTarget: 'aarch64-linux-gnu.2.17', dir: 'linux-aarch64', lib: 'libconfluxnative.so'],
            [zigTarget: 'x86_64-windows-gnu', dir: 'windows-x86_64', lib: 'confluxnative.dll'],
            [zigTarget: 'x86_64-macos', dir: 'macos-x86_64', lib: 'libconfluxnative.dylib'],
            [zigTarget: 'aarch64-macos', dir: 'macos-aarch64', lib: 'libconfluxnative.dylib'],
        ]
        targets.each { final Map<String, String> target ->
            final File outDir = rootProject.file("native/prebuilt/${target.dir}")
            outDir.mkdirs()
            final File outFile = new File(outDir, target.lib)
            final List<String> command = ['zig', 'cc', '-target', target.zigTarget] + nativeCflags + ['-o', outFile.absolutePath] + nativeSources + ['-lm']
            final Process process = command.execute(null, rootProject.projectDir)
            final StringWriter output = new StringWriter()
            process.waitForProcessOutput(output, output)
            if (process.exitValue() != 0) {
                throw new GradleException("zig cc failed for target ${target.zigTarget} (exit ${process.exitValue()}):\n${output}")
            }
            // The Windows (MinGW) link step also drops an import lib + a multi-megabyte PDB next
            // to the DLL; both are link-time-only artifacts a JNI System.load() never touches,
            // not worth committing.
            final String baseName = target.lib.replaceAll(/\.[^.]+$/, '')
            [".lib", ".pdb"].each { final String ext ->
                final File byproduct = new File(outDir, baseName + ext)
                if (byproduct.exists()) {
                    byproduct.delete()
                }
            }
        }
        // Provenance is a build product: hash the bytes this run just wrote, and carry the
        // existing WASM section forward instead of dropping it.
        final String zigVersion = ['zig', 'version'].execute().text.trim()
        final File buildInfo = rootProject.file('native/prebuilt/BUILD_INFO.md')
        final String previous = buildInfo.exists() ? buildInfo.text : ''
        final String existingWasm = previous.contains('## Web Map WASM Asset Provenance')
            ? previous.substring(previous.indexOf('## Web Map WASM Asset Provenance'))
            : ''
        final StringBuilder doc = new StringBuilder()
        doc << '# Prebuilt Native Binary Provenance\n\n'
        doc << "- **Cross-Compiler Toolchain**: `zig cc ${zigVersion}`\n"
        doc << "- **Compiler CFlags**: `${nativeCflags.join(' ')}`\n"
        doc << '- **Build Task**: `./gradlew buildNativesAll`\n\n'
        doc << '## Target Binaries & SHA-256 Checksums\n\n'
        doc << '| Target Platform | Binary File | Target Triple | SHA-256 Checksum | Size |\n'
        doc << '|---|---|---|---|---|\n'
        final Map<String, String> labels = [
            'windows-x86_64': 'Windows x86_64', 'linux-x86_64': 'Linux x86_64',
            'linux-aarch64': 'Linux aarch64', 'macos-x86_64': 'macOS x86_64',
            'macos-aarch64': 'macOS aarch64',
        ]
        final List<Map<String, String>> built = []
        targets.each { final Map<String, String> target ->
            final File outFile = new File(rootProject.file("native/prebuilt/${target.dir}"), target.lib)
            doc << "| ${labels[target.dir]} | `${target.dir}/${target.lib}` | `${target.zigTarget}` | " +
                "`${sha256Hex(outFile)}` | ${String.format('%,d', outFile.length())} bytes |\n"
            built << target
        }
        buildInfo.parentFile.mkdirs()
        buildInfo.text = doc.toString() + (existingWasm ? '\n' + existingWasm : '')
        println "buildNativesAll: native/prebuilt/BUILD_INFO.md regenerated (${built.size()} targets)"
    }
}
