// Minecraft 26.1 ships unobfuscated, which changes the build shape rather than just the names:
// loom applies without a remapping step, no mappings are resolved, mod dependencies need no
// remapping, and the compile output is already the shippable jar. Both plugin ids resolve to the
// same fabric-loom artifact (settings.gradle). Derived from the project name rather than the
// preprocessor's injected mcVersion because the plugin choice has to happen before it applies.
final int mcVersion = rootProject.mcVersionOf(project.name)
final boolean unobfuscated = mcVersion >= 260100
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
base { archivesName = "$id-$name" }
repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
sourceSets {
    gametest
}
// Loom wires Minecraft into main's and test's classpath configurations but not into a source set
// the build declares itself, so gametest has to inherit them explicitly. It has to happen through
// extendsFrom rather than the usual `compileClasspath += main.compileClasspath`: the preprocessor
// captures SourceSet.getCompileClasspath() from its sourceSets.configureEach hook, which Gradle
// fires before this script's configuration closure, and `+=` rebinds the property to a new
// collection the preprocessor never sees. It would then remap gametest against a classpath with no
// Minecraft on it, silently leaving every net.minecraft name in core-version spelling - which does
// not compile once a name actually moved between versions.
configurations {
    gametestCompileClasspath.extendsFrom compileClasspath
    gametestRuntimeClasspath.extendsFrom runtimeClasspath
}
dependencies {
    // On an unobfuscated version there is nothing to remap into, so loom's mod* configurations
    // would only add a no-op remap step over dependencies that are already in final names.
    final Closure<?> autoImpl = { final Object... args -> unobfuscated ? implementation(*args) : modImplementation(*args) }
    minecraft "com.mojang:minecraft:$name"
    if (!unobfuscated) {
        mappings "net.fabricmc:yarn:$name+build.$yarn_mappings:v2"
    }
    autoImpl "net.fabricmc:fabric-loader:$loader_version"
    autoImpl "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"
    implementation project(':common')
    include project(':common')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    include 'org.nanohttpd:nanohttpd:2.3.1'
    include 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    // Compile the optional adapter against the exact MaliLib line for this Minecraft version.
    // This is deliberately absent from runtime and from the produced jar.
    if (unobfuscated) {
        compileOnly malilib_dependency
    } else {
        modCompileOnly malilib_dependency
    }
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // The preprocessor builds both remap classpaths out of the <sourceSet>CompileClasspath
    // *configuration* alone, and the java plugin puts main's output on the test source set's
    // classpath property instead of that configuration - so remap sees no confluxmap classes when
    // it maps test sources. Main gets away with it because all of its files are parsed together and
    // resolve from source; test sources are parsed on their own, so every project type comes back
    // unresolved. remap then hard-crashes on any signature holding an array of one (bombe ArrayType
    // gets a null component type) and silently skips remapping anything reached through a project
    // type. Restating main's output as a dependency puts it in the configuration both sides read.
    testImplementation sourceSets.main.output
    gametestImplementation sourceSets.main.output
}
test {
    useJUnitPlatform()
    dependsOn ':common:test'
}
loom {
    accessWidenerPath = file "${id}.accesswidener"
    // A refmap maps mixin targets from source names to the names the game actually ships. On an
    // unobfuscated version those are the same, so an empty name suppresses generation entirely.
    if (unobfuscated) {
        mixin.defaultRefmapName = ''
    }
    runs {
        server {
            property("mixin.debug.export", "true")
            ideConfigGenerated true
            if (project.hasProperty('connectionSmoke')) {
                runDir "build/connection-smoke/server"
                vmArg "-Xms256m"
                vmArg "-Xmx1G"
            }
        }
        client {
            property("mixin.debug.export", "true")
            ideConfigGenerated true
            // Automated smoke tests: -PautoServer makes the client join a local
            // offline server on launch. CI supplies a virtual display for the client.
            if (project.hasProperty('autoServer')) {
                // Minecraft 1.21+ no longer registers the legacy server/port options.
                if (mcVersion >= 12100) {
                    programArgs '--quickPlayMultiplayer', '127.0.0.1:25565'
                } else {
                    programArgs '--server', '127.0.0.1', '--port', '25565'
                }
            }
            if (project.hasProperty('connectionSmoke')) {
                runDir "build/connection-smoke/client"
                vmArg "-Xms256m"
                vmArg "-Xmx1G"
            }
        }
        if (mcVersion >= 12104) {
            clientGameTest {
                client()
                name "Client Game Test"
                source sourceSets.gametest
                vmArg "-Dfabric.client.gametest"
                vmArg "-Dfabric.client.gametest.modid=confluxmap-gametest"
                // Fabric documents a GitHub Actions race in its deterministic packet scheduler.
                // This smoke test only needs normal networking to prove that both companions load
                // and complete a real login, so the scheduler would add risk without adding coverage.
                vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
                vmArg "-Xms256m"
                vmArg "-Xmx1G"
                runDir "build/client-gametest"
            }
        }
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/gametest-results.xml"
            vmArg "-Djava.awt.headless=true"
            vmArg "-Dconfluxmap.quality.world-seed=0"
            vmArg "-Dconfluxmap.quality.report-dir=${project.buildDir}/reports/prediction-quality"
            if (project.hasProperty('qualitySample')) {
                vmArg "-Dconfluxmap.quality.sample=${project.property('qualitySample')}"
            }
            runDir "build/gametest"
        }
    }
}
JavaVersion javaCompatibility
if (mcVersion < 11700) javaCompatibility = JavaVersion.VERSION_1_8 else if (mcVersion < 11800) javaCompatibility = JavaVersion.VERSION_16 else if (mcVersion < 12005) javaCompatibility = JavaVersion.VERSION_17 else if (mcVersion < 260100) javaCompatibility = JavaVersion.VERSION_21 else javaCompatibility = JavaVersion.VERSION_25
tasks.withType(JavaCompile).configureEach {
    // One preprocessor mistake breaks a whole file for every downstream version at once, so
    // javac's default cap of 100 errors routinely hides most of a version's actual breakage.
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
// The subproject name is the Minecraft version this jar is compiled against; minecraft_versions is
// the set of versions it can run on, which is usually wider because most patch releases keep the
// client API intact. The jar advertises that set as a closed range, so a patch with no subproject
// of its own still gets a jar. Order in the property does not matter; checkVersionCoverage proves
// the claim against each version's mappings.
final Closure<Integer> mcSortKey = { final String candidate ->
    final List<String> parts = candidate.tokenize('.')
    (parts[0] + parts[1].padLeft(2, '0') + (parts.size() > 2 ? parts[2] : '0').padLeft(2, '0')).toInteger()
}
ext.supportedMinecraftVersions = minecraft_versions.trim().split(/\s+/).toList()
if (!supportedMinecraftVersions.contains(project.name)) {
    throw new GradleException("versions/${project.name}/gradle.properties: minecraft_versions must list ${project.name}")
}
final String oldestMinecraftVersion = supportedMinecraftVersions.min(mcSortKey)
final String newestMinecraftVersion = supportedMinecraftVersions.max(mcSortKey)
// Fabric API's mod id was `fabric` when 1.17 shipped and `fabric-api` afterwards. The 1.21 line
// still declares `provides: [fabric]` so either id resolves there, but 26.1 dropped that alias, and
// 1.17's build predates the rename - so only the ends of the matrix are actually constrained.
final String fabricApiId = mcVersion >= 260100 ? 'fabric-api' : 'fabric'
final String minecraftDependency = oldestMinecraftVersion == newestMinecraftVersion
        ? oldestMinecraftVersion
        : ">=$oldestMinecraftVersion <=$newestMinecraftVersion"
processResources {
    inputs.property 'modId', id
    inputs.property 'modVersion', project.version.toString()
    inputs.property 'minecraftDependency', minecraftDependency
    inputs.property 'loaderVersion', loader_version
    inputs.property 'fabricApiId', fabricApiId
    inputs.property 'javaVersion', javaCompatibility.getMajorVersion()
    from "${id}.accesswidener"
    filesMatching('fabric.mod.json') { expand id: id, version: version, minecraft_dependency: minecraftDependency, loader_version: loader_version, fabric_api_id: fabricApiId }
    filesMatching("${id}.mixins.json") { expand java_version: javaCompatibility.getMajorVersion() }
    // Bundles the committed native/prebuilt/<target>/ binaries into the jar (and dev classpath)
    // as natives/<target>/<libname>, so NativeLib can find them without any extra toolchain.
    from(rootProject.file('native/prebuilt')) { into 'natives' }
}
tasks.register('checkModMetadata') {
    group = 'verification'
    description = 'Verifies that expanded mod metadata matches the project version'
    dependsOn tasks.named('processResources')
    inputs.file layout.buildDirectory.file('resources/main/fabric.mod.json')
    inputs.property 'expectedVersion', project.version.toString()
    inputs.property 'expectedMinecraftDependency', minecraftDependency
    doLast {
        final File metadataFile = layout.buildDirectory.file('resources/main/fabric.mod.json').get().asFile
        final Map<String, ?> metadata = new groovy.json.JsonSlurper().parse(metadataFile) as Map<String, ?>
        if (metadata.version != project.version.toString()) {
            throw new GradleException("Expanded fabric.mod.json version ${metadata.version} does not match project version ${project.version}")
        }
        if (metadata.depends.minecraft != minecraftDependency) {
            throw new GradleException("Expanded fabric.mod.json Minecraft dependency ${metadata.depends.minecraft} does not match ${minecraftDependency}")
        }
    }
}
java {
    sourceCompatibility = javaCompatibility
    targetCompatibility = javaCompatibility
    // Only the unobfuscated line pins a toolchain: it targets Java 25, which the JDK that builds
    // every other version cannot emit. Leaving the rest unpinned keeps them compiling on whatever
    // JDK the developer or CI already has, exactly as before.
    if (unobfuscated) {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
    }
}
jar { from '../../LICENSE' }
tasks.register('checkCoreIsolation') {
    group = 'verification'
    description = 'Checks the platform-neutral common module.'
    dependsOn ':common:checkPlatformIsolation'
}
apply from: rootProject.file('gradle/version-coverage.gradle')
check.dependsOn 'checkCoreIsolation'
check.dependsOn 'checkModMetadata'
check.dependsOn 'checkVersionCoverage'
check.dependsOn 'runGametest'
tasks.register('buildRelease') {
    group = 'build'
    description = 'Assembles release artifacts and runs non-test release checks'
    dependsOn tasks.named('assemble')
    dependsOn tasks.named('checkCoreIsolation')
    dependsOn tasks.named('checkModMetadata')
    dependsOn tasks.named('checkVersionCoverage')
    dependsOn tasks.named('validateAccessWidener')
}
tasks.named('runGametest') {
    doFirst {
        final File runDirectory = project.file("${project.buildDir}/gametest")
        delete runDirectory
        delete project.file("${project.buildDir}/gametest-results.xml")
        runDirectory.mkdirs()
        new File(runDirectory, 'server.properties').text = '''\
level-seed=0
max-tick-time=0
online-mode=false
sync-chunk-writes=true
view-distance=2
'''
    }
}
if (project.hasProperty('connectionSmoke') && mcVersion >= 12100) {
    tasks.named('runClient') {
        doFirst {
            final File runDirectory = project.file("${project.buildDir}/connection-smoke/client")
            delete runDirectory
            runDirectory.mkdirs()
            // Fresh 1.21 clients show accessibility onboarding before Quick Play.
            // The smoke test has no UI driver, so complete that one-time choice up front.
            new File(runDirectory, 'options.txt').text = 'onboardAccessibility:false\n'
        }
    }
}
if (mcVersion >= 12104) {
    tasks.named('runClientGameTest') {
        doFirst {
            final File runDirectory = project.file("${project.buildDir}/client-gametest")
            delete runDirectory
            runDirectory.mkdirs()
            new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        }
    }
}
