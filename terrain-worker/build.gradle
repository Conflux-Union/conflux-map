plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

configurations {
    terrainProtocolBundle {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16
}

tasks.withType(JavaCompile).configureEach {
    options.release = 16
}

dependencies {
    implementation project(':common')
    terrainProtocolBundle project(':common')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    dependsOn configurations.terrainProtocolBundle
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from({
        configurations.terrainProtocolBundle.collect { final File dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }) {
        include 'cn/net/rms/confluxmap/terrain/protocol/**'
    }
    manifest {
        attributes 'Main-Class': 'cn.net.rms.confluxmap.terrain.TerrainWorkerMain'
    }
}

tasks.register('checkPackaging') {
    group = 'verification'
    description = 'Verifies the standalone worker contains its entrypoint and shared protocol only.'
    dependsOn tasks.named('jar')
    doLast {
        final File artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        final def archive = zipTree(artifact)
        if (archive.matching {
            include 'cn/net/rms/confluxmap/terrain/TerrainWorkerMain.class'
        }.files.size() != 1) {
            throw new GradleException("TerrainWorkerMain is missing from ${artifact}")
        }
        if (archive.matching {
            include 'cn/net/rms/confluxmap/terrain/protocol/TerrainWire.class'
        }.files.size() != 1) {
            throw new GradleException("Terrain protocol is missing from ${artifact}")
        }
        if (!archive.matching {
            include 'cn/net/rms/confluxmap/terrain/client/**'
        }.files.empty) {
            throw new GradleException("Parent-side terrain client leaked into ${artifact}")
        }
    }
}

tasks.withType(Test).configureEach {
    dependsOn tasks.named('jar')
    doFirst {
        systemProperty 'confluxmap.terrain.worker.jar',
            tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    }
}

test {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

check.dependsOn 'checkPackaging'

tasks.register('benchmark', Test) {
    group = 'verification'
    description = 'Runs opt-in terrain-process throughput measurements.'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
}
