name: Check
on:
  pull_request:
    paths-ignore:
      - '**/README.md'
      - '**/README_CN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.github/CODEOWNERS'
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
      - '**/README_CN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.github/CODEOWNERS'
permissions:
  contents: read
env:
  BUILD_VERSION: ${{ github.sha }}
jobs:
  Get-Versions:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.Get_Versions.outputs.shards }}
      latest: ${{ steps.Get_Versions.outputs.latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Get Minecraft versions
        id: Get_Versions
        run: |
          VERSIONS=$(find versions -maxdepth 1 -type d -name "[0-9]*.[0-9]*" | xargs -I {} basename {} | sort -V)
          # Round-robin into four balanced shards so each shard mixes slow (26.x) and fast
          # versions, and two concurrent runs stay inside the account's parallel-job budget
          # (8 shards + Get-Versions + Paper + Api per run).
          SHARDS=$(echo "$VERSIONS" | jq -R -s -c 'split("\n") | map(select(length > 0)) as $v | reduce range(0; ($v|length)) as $i ([[],[],[],[]]; .[$i % 4] += [$v[$i]])')
          echo "shards=$SHARDS" >> $GITHUB_OUTPUT
          echo "latest=$(echo "$VERSIONS" | tail -1)" >> $GITHUB_OUTPUT
  Build-Matrix:
    runs-on: ubuntu-24.04
    needs: Get-Versions
    name: Check (${{ join(matrix.shard, ', ') }})
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.Get-Versions.outputs.shards) }}
    env:
      SHARD_VERSIONS: ${{ toJson(matrix.shard) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
      # One shared cache for the whole matrix: every shard builds the preprocessor
      # chain up to its versions, so the shard containing the highest version has
      # the union. Only that shard saves - a shared key never gets overwritten, so
      # another shard saving first would pin the entry to partial content forever.
      - name: Cache Gradle packages
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-unified-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-unified-
            ${{ runner.os }}-gradle-
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Install Vulkan software ICD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Check shard
        id: check
        run: |
          tasks=""
          for v in $(echo "$SHARD_VERSIONS" | jq -r '.[]'); do
            tasks="$tasks :$v:check"
          done
          # Gametest servers all bind the default port, so they cannot run as parallel
          # tasks inside one invocation; the GameTest-Matrix job runs them instead.
          ./gradlew -Pversion="$BUILD_VERSION" $tasks -x runGametest
      # Native harnesses need gcc/cc, so they are NOT part of the version subprojects' `check`
      # (that would break Windows/macOS contributors). This Linux job runs the lightweight
      # smoke harness explicitly (baseline anchor, position purity and 12-case matrix smoke).
      - name: Verify native predictors (smoke)
        run: ./gradlew verifyNativeSmoke
      - name: Connect client to server for shard
        timeout-minutes: 45
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -Eeuo pipefail

          for v in $(echo "$SHARD_VERSIONS" | jq -r '.[]'); do
            export MINECRAFT_VERSION="$v"
            echo "=== Connection check for $v ==="
            (
          set -Eeuo pipefail

          minecraft_version="$MINECRAFT_VERSION"
          if [[ ! "$minecraft_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid matrix Minecraft version: $minecraft_version"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$minecraft_version"
          minecraft_version_number=$((10#$major * 10000 + 10#$minor * 100 + 10#${patch:-0}))

          if (( minecraft_version_number >= 12104 )); then
            echo "Running controlled client connection GameTest for Minecraft $minecraft_version"
            timeout --signal=TERM --kill-after=15s 240s \
              xvfb-run -a -s '-screen 0 1280x720x24' \
              ./gradlew ":$minecraft_version:runClientGameTest" \
              --no-daemon --no-parallel --console=plain
            echo "Client-server connection GameTest passed for Minecraft $minecraft_version"
            exit 0
          fi

          smoke_root="versions/$minecraft_version/build/connection-smoke"
          server_dir="$smoke_root/server"
          client_dir="$smoke_root/client"
          server_output="$smoke_root/server-output.log"
          client_output="$smoke_root/client-output.log"
          server_pid=""
          client_pid=""

          stop_process_group() {
            local process_id="$1"
            if [[ -z "$process_id" ]] || ! kill -0 -- "-$process_id" 2>/dev/null; then
              return
            fi

            kill -TERM -- "-$process_id" 2>/dev/null || true
            for _ in {1..10}; do
              if ! kill -0 -- "-$process_id" 2>/dev/null; then
                return
              fi
              sleep 1
            done
            kill -KILL -- "-$process_id" 2>/dev/null || true
          }

          finish() {
            local status=$?
            trap - EXIT
            set +e
            stop_process_group "$client_pid"
            stop_process_group "$server_pid"
            [[ -z "$client_pid" ]] || wait "$client_pid" 2>/dev/null
            [[ -z "$server_pid" ]] || wait "$server_pid" 2>/dev/null

            if (( status != 0 )); then
              echo "::group::Server output"
              [[ ! -f "$server_output" ]] || tail -n 200 "$server_output"
              echo "::endgroup::"
              echo "::group::Client output"
              [[ ! -f "$client_output" ]] || tail -n 200 "$client_output"
              echo "::endgroup::"
            fi
            exit "$status"
          }
          trap finish EXIT

          wait_for_server() {
            local deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$server_output" 2>/dev/null; then
                return
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "::error::runServer exited before the server became ready"
                return 1
              fi
              sleep 2
            done
            echo "::error::Timed out waiting for runServer to become ready"
            return 1
          }

          wait_for_client_login() {
            local deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              if grep -Eq 'logged in with entity id [0-9]+ at|joined the game' "$server_output" 2>/dev/null; then
                return
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "::error::runServer exited before the client connected"
                return 1
              fi
              if ! kill -0 "$client_pid" 2>/dev/null; then
                echo "::error::runClient exited before connecting to the server"
                return 1
              fi
              sleep 2
            done
            echo "::error::Timed out waiting for the client to connect"
            return 1
          }

          mkdir -p "$server_dir" "$client_dir"
          rm -f "$server_output" "$client_output"
          printf '%s\n' 'eula=true' > "$server_dir/eula.txt"
          printf '%s\n' \
            'online-mode=false' \
            'server-ip=127.0.0.1' \
            'server-port=25565' \
            'max-tick-time=0' \
            'spawn-protection=0' \
            'sync-chunk-writes=true' \
            'view-distance=2' > "$server_dir/server.properties"

          ./gradlew ":$minecraft_version:configureClientLaunch" ":$minecraft_version:downloadAssets" \
            --no-daemon --console=plain

          echo "Starting Minecraft $minecraft_version server"
          setsid ./gradlew ":$minecraft_version:runServer" -PconnectionSmoke \
            --no-daemon --console=plain > "$server_output" 2>&1 &
          server_pid=$!
          wait_for_server

          echo "Starting Minecraft $minecraft_version client under Xvfb"
          setsid xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew ":$minecraft_version:runClient" -PconnectionSmoke -PautoServer \
            --no-daemon --console=plain > "$client_output" 2>&1 &
          client_pid=$!
          wait_for_client_login

          grep -Em1 'logged in with entity id [0-9]+ at|joined the game' "$server_output"
          echo "Client-server connection smoke test passed for Minecraft $minecraft_version"
            )
          done
      - name: Upload build for shard
        uses: actions/upload-artifact@v5
        with:
          name: confluxmap-shard-${{ strategy.job-index }}-${{ env.BUILD_VERSION }}
          path: versions/*/build/libs/*.jar
          if-no-files-found: error
      - name: Upload connection smoke logs for shard
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: client-server-smoke-logs-shard-${{ strategy.job-index }}
          path: |
            versions/*/build/connection-smoke/server-output.log
            versions/*/build/connection-smoke/client-output.log
            versions/*/build/connection-smoke/server/logs/latest.log
            versions/*/build/connection-smoke/client/logs/latest.log
            versions/*/build/client-gametest/logs/latest.log
            versions/*/build/client-gametest/crash-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish prediction quality summary
        if: always()
        env:
          ARTIFACT_NAME: prediction-quality-shard-${{ strategy.job-index }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          for v in $(echo "$SHARD_VERSIONS" | jq -r '.[]'); do
            export MINECRAFT_VERSION="$v"
            export REPORT_PATH="versions/$v/build/reports/prediction-quality/report.json"

            if [[ ! -f "$REPORT_PATH" ]]; then
              {
                echo "## Prediction quality - Minecraft $v"
                echo
                echo "> The check finished with \`$CHECK_OUTCOME\`, but no prediction quality report was generated."
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          with open(os.environ["REPORT_PATH"], encoding="utf-8") as report_file:
              report = json.load(report_file)

          def percent(value):
              return f"{value * 100:.2f}%"

          aggregate = report["aggregate"]
          version = os.environ["MINECRAFT_VERSION"]
          outcome = os.environ["CHECK_OUTCOME"]
          artifact_name = os.environ["ARTIFACT_NAME"]
          artifact_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}#artifacts"
          )

          print(f"## Prediction quality - Minecraft {version}")
          print()
          print(
              f"Check: **{outcome}** · World seed: `{report['worldSeed']}` · "
              f"Corpus seed: `{report['corpusSeed']}` · Samples: **{report['sampleCount']}**"
          )
          print()
          print("### Aggregate metrics")
          print()
          print("| Metric | Value |")
          print("| --- | ---: |")
          aggregate_rows = (
              ("Mean combined score", percent(aggregate["meanCombinedScore"])),
              ("Minimum combined score", percent(aggregate["minimumCombinedScore"])),
              ("Mean coverage accuracy", percent(aggregate["meanCoverageAccuracy"])),
              ("Mean surface-kind accuracy", percent(aggregate["meanSurfaceKindAccuracy"])),
              ("Mean height MAE", f"{aggregate['meanHeightMae']:.2f} blocks"),
              ("Mean height bias", f"{aggregate['meanHeightBias']:+.2f} blocks"),
              ("Mean height within two blocks", percent(aggregate["meanHeightWithinTwo"])),
              ("Water-weighted fluid-bucket accuracy", percent(aggregate["waterWeightedFluidBucketAccuracy"])),
              ("Mean color similarity", percent(aggregate["meanColorSimilarity"])),
              ("Mean structural similarity", percent(aggregate["meanStructuralSimilarity"])),
              ("Mean exact edge F1", percent(aggregate["meanExactEdgeF1"])),
              ("Mean tolerant edge F1", percent(aggregate["meanEdgeF1"])),
          )
          for name, value in aggregate_rows:
              print(f"| {name} | {value} |")

          print()
          print("### Per-sample metrics")
          print()
          print(
              "| Sample | Dimension | Tile | Biome | Combined | Coverage | Kind | "
              "Height MAE / bias / P95 | Fluid | Color | SSIM | Exact edge F1 | Tolerant edge F1 |"
          )
          print("| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |")
          for sample in report["samples"]:
              metrics = sample["metrics"]
              height = f"{metrics['heightMae']:.2f} / {metrics['heightBias']:+.2f} / {metrics['heightP95']:.0f}"
              print(
                  f"| `{sample['id']}` | `{sample['dimension']}` | "
                  f"{sample['tileX']}, {sample['tileZ']} | `{sample['dominantBiomeId']}` | "
                  f"{percent(metrics['combinedScore'])} | {percent(metrics['coverageAccuracy'])} | "
                  f"{percent(metrics['surfaceKindAccuracy'])} | {height} | "
                  f"{percent(metrics['fluidBucketAccuracy'])} | {percent(metrics['colorSimilarity'])} | "
                  f"{percent(metrics['structuralSimilarity'])} | {percent(metrics['exactEdgeF1'])} | "
                  f"{percent(metrics['edgeF1'])} |"
              )

          print()
          print(
              f"Raw JSON, the HTML report, and worst-case images remain available in "
              f"the [{artifact_name}]({artifact_url}) artifact."
          )
          PY
          done
      - name: Upload prediction quality report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: prediction-quality-shard-${{ strategy.job-index }}
          path: versions/*/build/reports/prediction-quality/
          if-no-files-found: warn
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
      - name: Save unified Gradle cache
        if: always() && contains(matrix.shard, needs.Get-Versions.outputs.latest)
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-unified-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
  GameTest-Matrix:
    runs-on: ubuntu-24.04
    needs: Get-Versions
    name: Gametest (${{ join(matrix.shard, ', ') }})
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJson(needs.Get-Versions.outputs.shards) }}
    env:
      SHARD_VERSIONS: ${{ toJson(matrix.shard) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-unified-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-unified-
            ${{ runner.os }}-gradle-
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run gametests for shard
        run: |
          # Gametest servers all bind the default port, so the shard's versions must run
          # one at a time; separate shards still parallelize across jobs.
          for v in $(echo "$SHARD_VERSIONS" | jq -r '.[]'); do
            echo "::group::Gametest $v"
            ./gradlew ":$v:runGametest" --console=plain
            echo "::endgroup::"
          done
      - name: Upload gametest logs for shard
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-logs-shard-${{ strategy.job-index }}
          path: |
            versions/*/build/gametest-results.xml
            versions/*/build/gametest/logs/
            versions/*/build/gametest/crash-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
  Build-Paper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-paper-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-paper-
            ${{ runner.os }}-gradle-
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Check Paper companion
        run: ./gradlew -Pversion="$BUILD_VERSION" :paper:check
      - name: Upload Paper build
        uses: actions/upload-artifact@v5
        with:
          name: confluxmap-paper-${{ env.BUILD_VERSION }}
          path: paper/build/libs/*.jar
          if-no-files-found: error
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
  Check-Api:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-api-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-api-
            ${{ runner.os }}-gradle-
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Check native legacy prediction oracle & matrix parity
        run: ./gradlew -Pversion="$BUILD_VERSION" testNativeLegacy
      - name: Check api module
        run: ./gradlew -Pversion="$BUILD_VERSION" :api:check
      - name: Stop Gradle daemon
        if: always()
        run: ./gradlew --stop
