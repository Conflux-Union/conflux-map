name: 文档或其他问题（中文）
description: 用中文报告文档问题、提出项目疑问或反馈其他事项
title: "[Other]: "
labels: []
assignees: []
body:
  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - 文档
        - 项目疑问
        - 打包或分发
        - 其他
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: 概要
      description: 请用一句话描述这个问题。
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 详细说明
      description: 请说明具体问题、疑问或需要修正的内容。
    validations:
      required: true

  - type: textarea
    id: proposed-result
    attributes:
      label: 期望结果
      description: 如果适用，请说明应该如何调整。

  - type: textarea
    id: additional-context
    attributes:
      label: 其他信息
      description: 可添加相关链接、截图、版本信息或相关 Issue。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 Issue，没有发现重复内容。
          required: true
        - label: 我已从附件中删除敏感信息。
          required: true
