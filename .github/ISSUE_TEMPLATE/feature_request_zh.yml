name: 功能建议（中文）
description: 用中文建议改进或新功能
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请先描述需要解决的问题，再说明期望的结果。这样可以在不受特定实现方案限制的情况下评估需求。

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 你想完成什么？这项功能会帮助哪些用户？
    validations:
      required: true

  - type: textarea
    id: current-limitation
    attributes:
      label: 当前限制
      description: 目前有哪些操作很困难、缺失或无法完成？
    validations:
      required: true

  - type: textarea
    id: proposed-result
    attributes:
      label: 期望结果
      description: 请描述你希望看到的行为或最终效果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 请描述你尝试过的临时方案或其他解决方法。

  - type: input
    id: minecraft-version
    attributes:
      label: 相关 Minecraft 版本
      placeholder: "例如：1.21.4 或全部版本"

  - type: textarea
    id: additional-context
    attributes:
      label: 其他信息
      description: 可添加界面草图、其他模组的示例、相关 Issue 或其他有用信息。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 Issue，没有发现重复建议。
          required: true
        - label: 我描述了使用场景，而不只是具体实现方式。
          required: true
