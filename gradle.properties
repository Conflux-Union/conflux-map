# Full-matrix local runs (parallel remapJar across all versions) exhausted the
# previous 2G daemon heap. 4G stays safely under the 7G RAM of the ubuntu-24.04
# CI runners even after adding forked test/gametest JVMs; CI shards never came
# close to the old 2G cap, so this only raises the ceiling without changing CI
# behavior. Machines that still OOM on a full local `check` can override per
# invocation: ./gradlew check -Dorg.gradle.jvmargs=-Xmx6G
org.gradle.jvmargs=-Xmx4G
# Parallel task execution across the version projects is safe on Gradle 9.5 with
# preprocessor v1.0.1: full-matrix compile/test reruns show no cross-project lock
# errors. The previous `false` dated from the Gradle 9.3-era template and was never
# retested after the wrapper moved past 9.3. CI shards rely on this to pipeline
# several versions through a single Gradle invocation.
org.gradle.parallel=true
