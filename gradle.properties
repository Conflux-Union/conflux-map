# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
# Parallel task execution across the version projects is safe on Gradle 9.5 with
# preprocessor v1.0.1: full-matrix compile/test reruns show no cross-project lock
# errors. The previous `false` dated from the Gradle 9.3-era template and was never
# retested after the wrapper moved past 9.3. CI shards rely on this to pipeline
# several versions through a single Gradle invocation.
org.gradle.parallel=true
